
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Backend accepts document uploads up to 10 MB (nginx default is 1 MB)
    client_max_body_size 12m;

    # React frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API requests to FastAPI
    location /api/ {
        proxy_pass http://backend:8000;

        # $http_host keeps the port (localhost:3000) so backend redirects resolve correctly
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI verification calls can take longer than the 60s default
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
