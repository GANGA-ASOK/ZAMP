services:
  backend:
    build:
      context: ./backend

    env_file:
      - ./backend/.env

    expose:
      - "8000"

    restart: unless-stopped
  frontend:
    build:
      context: ./frontend/ZAMP
      args:
        VITE_API_BASE_URL: /api

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped
