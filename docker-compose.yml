services:
  backend:
    build:
      context: ./backend

    env_file:
      - ./backend/.env

    expose:
      - "8000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/ZAMP
      args:
        VITE_API_BASE_URL: /api

    ports:
      - "3000:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped
